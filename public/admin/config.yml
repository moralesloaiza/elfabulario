      - { name: "nota_curador", label: "Nota del curador", widget: "markdown", required: false, hint: "Comentarios adicionales del curador. Aparece como sección aparte tras la fábula." }

  - name: "entradas"
    label: "Entradas"
    label_singular: "Entrada"
    identifier_field: "titulo"
    folder: "src/content/entradas"
    create: true
    slug: "{{slug}}"
    preview_path: "entradas/{{slug}}"
    extension: "md"
    format: "frontmatter"
    summary: "{{borrador | ternary('[BORRADOR] ', '')}}{{titulo}} — {{tipo}} ({{fecha | date('YYYY-MM-DD')}})"
    description: "Bitácora del blog (anuncios, hitos, biografías de colaboradores) y correspondencia (cartas del público con réplica del curador)."
    view_filters:
      - { label: "Borradores", field: borrador, pattern: true }
      - { label: "Publicadas", field: borrador, pattern: false }
      - { label: "Bitácora", field: tipo, pattern: "bitacora" }
      - { label: "Correspondencia", field: tipo, pattern: "correspondencia" }
    view_groups:
      - { label: "Tipo", field: tipo }
      - { label: "Estado", field: borrador }
    fields:
      # --- Identidad ---
      - { name: "titulo", label: "Título", widget: "string" }
      - { name: "fecha", label: "Fecha de publicación", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { name: "resumen", label: "Resumen", widget: "text", required: false }
      - { name: "ilustracion", label: "Ilustración", widget: "image", required: false }
      - { name: "borrador", label: "Borrador", widget: "boolean", default: false }

      # --- Firma del curador ---
      - { name: "curador", label: "Curador (firma pública)", widget: "string" }
      - { name: "es_seudonimo", label: "¿La firma es un seudónimo?", widget: "boolean", default: false }
      - { name: "nombre_real", label: "Nombre real (privado)", widget: "string", required: false }

      # --- Discriminador de formato ---
      - name: "tipo"
        label: "Tipo de entrada"
        widget: "select"
        required: true
        default: "bitacora"
        hint: "Bitácora = entrada editorial regular. Correspondencia = carta de un lector con réplica."
        options:
          - { label: "Bitácora", value: "bitacora" }
          - { label: "Correspondencia (carta)", value: "correspondencia" }

      # --- Campos exclusivos de correspondencia (rellenar solo si Tipo = Correspondencia) ---
      - { name: "remitente", label: "Remitente", widget: "string", required: false, hint: "Solo correspondencia. Nombre publicable del autor de la carta; usa 'Un lector' para cartas anónimas. Obligatorio si Tipo = Correspondencia." }
      - name: "fabula_referida"
        label: "Fábula referida"
        widget: "relation"
        collection: "fabulas"
        value_field: "{{slug}}"
        search_fields: ["titulo"]
        display_fields: ["titulo"]
        required: false
        hint: "Solo correspondencia. Si la carta discute una fábula concreta, selecciónala."

      # --- Cuerpo ---
      - { name: "body", label: "Cuerpo", widget: "markdown", hint: "Para correspondencia: usa '## Carta' y '## Respuesta' como encabezados de las dos secciones." }

  - name: "autores"
    label: "Autores"
    label_singular: "Autor"
    identifier_field: "nombre"
    folder: "src/content/autores"
    create: true
    slug: "{{slug}}"
    preview_path: "autores/{{slug}}"
    extension: "md"
    format: "frontmatter"
    summary: "{{nombre}} ({{tipo}})"
    description: "Una entrada por autor (clásico o colaborador). El slug del archivo es la clave canónica que las fábulas referencian; renombrar el campo 'nombre' no rompe vínculos. El cuerpo Markdown es la bio o reseña."
    view_filters:
      - { label: "Clásicos", field: tipo, pattern: "clasico" }
      - { label: "Colaboradores", field: tipo, pattern: "colaborador" }
    view_groups:
      - { label: "Tipo", field: tipo }
    fields:
      # --- Identidad ---
      - { name: "nombre", label: "Nombre", widget: "string", hint: "Nombre completo tal como debe mostrarse en el sitio." }
      - name: "tipo"
        label: "Tipo"
        widget: "select"
        required: true
        default: "clasico"
        options:
          - { label: "Clásico", value: "clasico" }
          - { label: "Colaborador", value: "colaborador" }
      - { name: "imagen", label: "Retrato / ilustración", widget: "image", required: false, hint: "Imagen del autor. Proporción 1:1 preferida; 3:2 también funciona." }

      # --- Datos biográficos ---
      - { name: "nacionalidad", label: "Nacionalidad", widget: "string", required: false }
      - { name: "nacimiento", label: "Año de nacimiento", widget: "number", required: false, value_type: "int", min: 0, max: 2100 }
      - { name: "muerte", label: "Año de muerte", widget: "number", required: false, value_type: "int", min: 0, max: 2100 }
      - { name: "siglo", label: "Siglo (texto libre)", widget: "string", required: false, hint: "Opcional. Útil cuando no se conocen fechas exactas (p.ej., 'siglo VI a. C.')." }

      # --- Identidad real y enlaces (sobre todo para colaboradores) ---
      - { name: "nombre_real", label: "Nombre real (privado)", widget: "string", required: false, hint: "Solo para registros internos cuando 'nombre' es un seudónimo." }
      - { name: "github_username", label: "Usuario de GitHub", widget: "string", required: false }
      - name: "enlaces"
        label: "Enlaces"
        widget: "list"
        required: false
        summary: "{{fields.etiqueta}}"
        fields:
          - { name: "etiqueta", label: "Etiqueta", widget: "string" }
          - { name: "url", label: "URL", widget: "string", pattern: ['^https?://', 'Debe empezar con http:// o https://'] }

      # --- Bio / reseña ---
      - { name: "body", label: "Bio / reseña", widget: "markdown", hint: "Texto biográfico (para clásicos) o reseña personal (para colaboradores)." }

  - name: "destacado"
    label: "Destacado de la home"
    description: "Singleton: el elemento curado que aparece destacado en la home. Solo uno activo a la vez. Polimórfico (fábula, entrada o autor)."
    files:
      - name: "actual"
        label: "Destacado actual"
        file: "src/content/destacado/actual.md"
        fields:
          - { name: "activo", label: "Activo", widget: "boolean", default: true, hint: "Desmarca para apagar el destacado sin borrar la referencia." }
          - { name: "cintillo", label: "Cintillo (texto sobre el título)", widget: "string", hint: "Texto editorial breve, en mayúsculas se renderiza. Ejemplos: 'Fábula del mes', 'Carta recibida', 'El curador recomienda', 'En portada'." }
          - name: "tipo"
            label: "Tipo de destacado"
            widget: "select"
            required: true
            default: "fabula"
            options:
              - { label: "Fábula", value: "fabula" }
              - { label: "Entrada", value: "entrada" }
              - { label: "Autor", value: "autor" }
          - name: "fabula_referida"
            label: "Fábula"
            widget: "relation"
            collection: "fabulas"
            value_field: "{{slug}}"
            search_fields: ["titulo"]
            display_fields: ["titulo"]
            required: false
            hint: "Selecciona si Tipo = Fábula. La fábula debe tener ilustración."
          - name: "entrada_referida"
            label: "Entrada"
            widget: "relation"
            collection: "entradas"
            value_field: "{{slug}}"
            search_fields: ["titulo"]
            display_fields: ["titulo"]
            required: false
            hint: "Selecciona si Tipo = Entrada. La entrada debe tener ilustración."
          - name: "autor_referido"
            label: "Autor"
            widget: "relation"
            collection: "autores"
            value_field: "{{slug}}"
            search_fields: ["nombre"]

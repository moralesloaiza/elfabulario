          - { label: "Tortuga", value: "tortuga" }
          - { label: "Zarigüeya", value: "zarigueya" }
          - { label: "Zorro", value: "zorro" }
          # Roles humanos
          - { label: "Abogado", value: "abogado" }
          - { label: "Anciano", value: "anciano" }
          - { label: "Cazador", value: "cazador" }

# Panel editorial de El Fabulario (Decap CMS).
# Este archivo define cómo los colaboradores ven y editan las fábulas.
# Debe mantenerse sincronizado A MANO con src/content.config.ts y
# src/utils/taxonomia.ts (la fuente única de verdad de slugs/displays).

backend:
  name: github
  repo: moralesloaiza/elfabulario
  branch: main
  base_url: https://auth.elfabulario.com
  auth_endpoint: /auth

# URL pública del sitio (usada por el botón "Ver en directo")
site_url: https://elfabulario.com
display_url: https://elfabulario.com

# Dónde Decap sube las imágenes
media_folder: "src/assets/uploads"
public_folder: "/src/assets/uploads"

# Idioma de la interfaz del CMS
locale: "es"

# Las ediciones pasan por pull request antes de publicarse
publish_mode: editorial_workflow

collections:
  - name: "fabulas"
    label: "Fábulas"
    label_singular: "Fábula"
    identifier_field: "titulo"
    folder: "src/content/fabulas"
    create: true
    slug: "{{slug}}"
    preview_path: "fabulas/{{slug}}"
    extension: "md"
    format: "frontmatter"
    summary: "{{titulo}} — {{autor}} ({{fecha | date('YYYY-MM-DD')}})"
    fields:
      # --- Identidad de la fábula ---
      - { name: "titulo", label: "Título", widget: "string" }
      - { name: "resumen", label: "Resumen", widget: "text", required: false, hint: "1–2 frases que describan la fábula. Se usa en listados y RSS. Opcional." }
      - { name: "fecha", label: "Fecha de publicación", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { name: "fecha_actualizada", label: "Fecha de última actualización", widget: "datetime", required: false, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { name: "ilustracion", label: "Ilustración", widget: "image", required: false, hint: "Proporción recomendada 3:2, mínimo 1200×800." }
      - { name: "spotify_url", label: "Enlace Spotify", widget: "string", required: false, hint: "URL de la narración/declamación en Spotify (track o episodio de podcast)." }
      - { name: "borrador", label: "Borrador (no se publica todavía)", widget: "boolean", default: false }

      # --- Taxonomía ---
      # Cuatro campos que sustituyen al antiguo `etiquetas`. Listas cerradas:
      # los colaboradores eligen de un dropdown, no escriben libre. El humano
      # genérico no se etiqueta (queda implícito); solo se etiquetan roles
      # humanos específicos (rey, cazador, abogado, etc.).
      - name: "personajes"
        label: "Personajes"
        widget: "select"
        multiple: true
        required: false
        default: []
        hint: "Animales, roles humanos o entidades míticas que protagonizan la fábula. El humano genérico no se etiqueta."
        options:
          # Animales
          - { label: "Águila", value: "aguila" }
          - { label: "Ardilla", value: "ardilla" }
          - { label: "Avispa", value: "avispa" }
          - { label: "Buey", value: "buey" }

          - { label: "Poder", value: "poder" }
          - { label: "Prudencia", value: "prudencia" }
          - { label: "Riqueza", value: "riqueza" }
          - { label: "Sabiduría", value: "sabiduria" }
          - { label: "Soberbia", value: "soberbia" }
          - { label: "Trabajo", value: "trabajo" }
          - { label: "Traición", value: "traicion" }

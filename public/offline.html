<!doctype html>
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<meta name="theme-color" content="#F0E5CE" />
		<title>Sin conexión · El Fabulario</title>
		<style>
			/* Autónoma: sin recursos externos. Usa las familias de día de
			   Fabulario con respaldos del sistema por si no están cacheadas. */
			:root {
				--marfil: #f0e5ce;
				--negro: #1a1714;
				--text-soft: #4a413a;
				--oro: #c9a14a;
				--oro-texto: #7a5f1f;
				--navy: #0f1b3d;
				--display: 'Cinzel', 'Trajan Pro', 'Optima', serif;
				--body: 'Cormorant Garamond', 'EB Garamond', Georgia, serif;
			}
			* {
				box-sizing: border-box;
			}
			html,
			body {
				margin: 0;
				padding: 0;
			}
			body {
				min-height: 100vh;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 1.5rem;
				padding: 2rem 1.25rem;
				background: var(--marfil);
				color: var(--negro);
				font-family: var(--body);
				text-align: center;
			}
			.logo {
				width: 96px;
				height: 96px;
			}
			h1 {
				margin: 0;
				font-family: var(--display);
				font-weight: 600;
				font-size: clamp(1.75rem, 1.3rem + 2vw, 2.5rem);
				letter-spacing: 0.05em;
				text-transform: uppercase;
				color: var(--negro);
			}
			p {
				margin: 0;
				max-width: 34rem;
				font-size: 1.25rem;
				line-height: 1.6;
				color: var(--text-soft);
			}
			.eyebrow {
				font-family: var(--display);
				font-size: 0.75rem;
				letter-spacing: 0.28em;
				text-transform: uppercase;
				color: var(--oro-texto);
				margin: 0;
			}
			button {
				margin-top: 0.5rem;
				font-family: var(--display);
				font-size: 0.8125rem;
				letter-spacing: 0.2em;
				text-transform: uppercase;
				color: var(--marfil);
				background: var(--negro);
				border: 1.5px solid var(--negro);
				padding: 0.75rem 1.75rem;
				cursor: pointer;
				transition:
					background-color 200ms cubic-bezier(0.2, 0, 0, 1),
					color 200ms cubic-bezier(0.2, 0, 0, 1);
			}
			button:hover,
			button:focus-visible {
				background: var(--oro);
				color: var(--negro);
				border-color: var(--oro);
			}
		</style>
	</head>
	<body>

			/>

		<p class="eyebrow">El Fabulario</p>
		<h1>Sin conexión</h1>
		<p>
			No hay conexión a internet en este momento. Las fábulas que ya has
			visitado siguen disponibles sin conexión; para el resto, vuelve a
			intentarlo cuando recuperes la señal.

	</body>
</html>

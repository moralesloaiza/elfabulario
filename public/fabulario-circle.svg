<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="El Fabulario">
  <title>El Fabulario</title>
  <!-- Círculo exterior dorado -->
  <circle cx="100" cy="100" r="98" fill="#C9A14A"/>
  <!-- Anillo navy (gap entre borde grueso exterior y borde fino interior) -->

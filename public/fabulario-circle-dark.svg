<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="El Fabulario">
  <title>El Fabulario</title>
  <!-- Versión "outline" para fondos oscuros: solo trazos dorados sobre transparente -->
  <!-- Aro exterior grueso: dos círculos con regla "evenodd" para crear un anillo -->
  <path d="M 198,100 A 98,98 0 1,1 2,100 A 98,98 0 1,1 198,100 Z
           M 193,100 A 93,93 0 1,0 7,100 A 93,93 0 1,0 193,100 Z"
        fill="#C9A14A" fill-rule="evenodd"/>
  <!-- Aro interior fino -->
  <path d="M 187,100 A 87,87 0 1,1 13,100 A 87,87 0 1,1 187,100 Z
           M 184,100 A 84,84 0 1,0 16,100 A 84,84 0 1,0 184,100 Z"
        fill="#C9A14A" fill-rule="evenodd"/>
  <!-- Letra F en oro -->
  <path d="M 73 52 L 137 52 L 137 70 L 93 70 L 93 92 L 122 92 L 122 108 L 93 108 L 93 150 L 73 150 Z"
        fill="#C9A14A"/>
</svg>
